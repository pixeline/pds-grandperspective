<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the full-bleed surfaces (the rail drawer, the
		     map's info strip) reach the physical edges on a notched phone; every
		     one of them pads itself back with env(safe-area-inset-*). Without
		     `cover` iOS letterboxes the page and the app looks inset for no
		     stated reason. No maximum-scale/user-scalable=no: pinch-zoom is the
		     only way to read an 11px mono label on a phone, and taking it away
		     is an accessibility failure, not a polish step. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- These live here, not in a component's <svelte:head>, because a browser requests the
		     favicon and reads the manifest before hydration, so links injected
		     after it are unreliable or missed entirely.
		     %sveltekit.assets% keeps the paths relative, so the build stays
		     droppable into any subfolder of the deployment domain. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32"
			href="%sveltekit.assets%/icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16"
			href="%sveltekit.assets%/icon-16.png" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#171717" />

		<!-- Social / link previews. og:image MUST be an absolute URL (relative
		     paths are ignored by every scraper), so these name the permanent
		     deployment path directly rather than using %sveltekit.assets%. If the
		     app ever moves, update these four absolute URLs alongside the OAuth
		     client_id, which is pinned to the same path. -->
		<title>GrandPerspective — PDS edition</title>
		<meta name="description"
			content="Draw any AT Protocol repository as a treemap sized by stored bytes. Read anyone's repo unauthenticated; edit your own." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://pixeline.be/pds-grandperspective/" />
		<meta property="og:title" content="PDS Explorer" />
		<meta property="og:description"
			content="Explore any AT Protocol repository's records as a treemap." />
		<meta property="og:image" content="https://pixeline.be/pds-grandperspective/og-default.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:alt"
			content="A treemap of colored blocks in the GrandPerspective palette, beside the headline PDS Explorer." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="PDS Explorer" />
		<meta name="twitter:description"
			content="Explore any AT Protocol repository's records as a treemap." />
		<meta name="twitter:image" content="https://pixeline.be/pds-grandperspective/og-default.jpg" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com"
			crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet" />

		%sveltekit.head%
		<script
			src="https://cdn.counter.dev/script.js"
			data-id="d4da7416-0a1c-481d-a49e-dab45f63aa2e"
			data-utcoffset="1"></script>
		<script
			src="https://analytics.ahrefs.com/analytics.js"
			data-key="VwAkBLSYZQ9QJfQxWkslWA"
			async></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
